<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Raul Andrei Duia</title>
  <desc id="desc">Dezvoltator Full-Stack &amp; Jocuri · Specialist PC &amp; IT</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b1a11"/><stop offset=".55" stop-color="#1a100b"/><stop offset="1" stop-color="#0b0807"/>
    </linearGradient>
    <radialGradient id="glow" cx=".86" cy=".15" r=".65">
      <stop offset="0" stop-color="#8b1a1a" stop-opacity=".38"/><stop offset="1" stop-color="#8b1a1a" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="11" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.9  0 0 0 0 0.75  0 0 0 0 0.6  .10 0 0 0 0"/>
    </filter>
    <clipPath id="card"><rect x="6" y="6" width="1188" height="308" rx="24"/></clipPath>
  </defs>
  <style>
    .name{font:700 70px 'Segoe UI',Inter,'Helvetica Neue',Helvetica,Arial,sans-serif;fill:#f1e6d3;letter-spacing:.5px}
    .title{font:600 29px 'Segoe UI',Inter,'Helvetica Neue',Helvetica,Arial,sans-serif;fill:#c9a27a}
    .dot{fill:#c4342f}
    .sub{font:600 19px 'Segoe UI',Inter,'Helvetica Neue',Helvetica,Arial,sans-serif;fill:#9c8670;letter-spacing:3px}
    .cursor{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.cursor{animation:none}}
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>
    <rect width="1200" height="320" filter="url(#grain)"/>
  </g>
  <rect x="6" y="6" width="1188" height="308" rx="24" fill="none" stroke="#4a2c1d" stroke-width="2"/>
  <rect x="22" y="22" width="1156" height="276" rx="14" fill="none" stroke="#b5835a" stroke-opacity=".55" stroke-width="2" stroke-dasharray="11 7" stroke-linecap="round"/>

  <rect x="72" y="88" width="6" height="150" rx="3" fill="#a3262a"/>
  <text class="name" x="104" y="148">Raul Andrei Duia</text>
  <text class="title" x="106" y="200">Dezvoltator Full-Stack &amp; Jocuri<tspan class="dot"> · </tspan>Specialist PC &amp; IT<tspan class="dot cursor"> _</tspan></text>
  <text class="sub" x="107" y="242">WEB  ·  APLICAȚII  ·  JOCURI  ·  PC-URI  ·  SUPORT IT</text>

  <!-- circuit traces -->
  <g fill="none" stroke="#6b3f26" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1030 120 V78 H1108"/><path d="M1000 120 V60 H950"/>
    <path d="M1133 200 H1160"/><path d="M927 190 H884 V246"/>
  </g>
  <g fill="#6b3f26">
    <circle cx="1108" cy="78" r="5"/><circle cx="950" cy="60" r="5"/>
    <circle cx="1160" cy="200" r="5"/><circle cx="884" cy="246" r="5"/>
  </g>

  <!-- controller -->
  <g opacity=".85">
    <path d="M980 120 H1080 A40 40 0 0 1 1119 151 L1133 213 A24 24 0 0 1 1091 232 L1069 206 H991 L969 232 A24 24 0 0 1 927 213 L941 151 A40 40 0 0 1 980 120 Z"
          fill="none" stroke="#b5835a" stroke-width="4" stroke-linejoin="round"/>
    <path d="M980 152 V176 M968 164 H992" stroke="#b5835a" stroke-width="7" stroke-linecap="round"/>
    <circle cx="1080" cy="152" r="6.5" fill="#c4342f"/><circle cx="1095" cy="166" r="6.5" fill="#c4342f"/>
    <circle cx="1065" cy="166" r="6.5" fill="#c4342f"/><circle cx="1080" cy="180" r="6.5" fill="#c4342f"/>
    <text x="1030" y="196" text-anchor="middle" style="font:700 18px Consolas,'Cascadia Code',Menlo,monospace;fill:#b5835a">&lt;/&gt;</text>
  </g>
</svg>
